name: test

on:
  push:
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,torch]"
      - run: python -m pytest
      - run: pines reproduce --config configs/toy_study.json --output-dir artifacts/ci-toy
