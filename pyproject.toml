[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pines-snn"
version = "0.1.0"
description = "Prediction-invariance certification across SNN execution semantics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anonymous Authors"}]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "h5py>=3.11",
    "matplotlib>=3.9",
    "scipy>=1.14",
]
benchmarks = ["h5py>=3.11", "matplotlib>=3.9", "scipy>=1.14"]
nir = ["nir>=1.0"]
torch = ["torch>=2.5"]

[project.scripts]
pines = "pines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
